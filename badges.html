<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>พิมพ์ป้ายชื่อคล้องคอ A6 (4 ใบ/A4) - สัมมนา AI Chatbot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f1f5f9;
    }

    /* ขนาดหน้ากระดาษ A4 สำหรับแสดงผลและพิมพ์ */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: white;
      margin: 16px auto;
      padding: 6mm;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4mm;
      box-sizing: border-box;
    }

    /* ป้ายชื่อแต่ละใบ (ขนาดประมาณ A6 พอดีซองคล้องคอมาตรฐาน) */
    .badge-card {
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      position: relative;
      box-sizing: border-box;
    }

    /* รูเจาะสายคล้องคอ (ไกด์ไลน์ด้านบน) */
    .lanyard-slot {
      width: 16mm;
      height: 3.5mm;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      margin: 4mm auto 2mm auto;
    }

    .qr-box img, .qr-box canvas {
      margin: 0 auto;
      display: block;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: white !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
      }
      .a4-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- ==================== CONTROL BAR (ซ่อนตอนพิมพ์) ==================== -->
  <header class="no-print sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-lg bg-[#1E3A8A] text-white flex items-center justify-center">
            <i data-lucide="id-card" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-900 text-base">ระบบพิมพ์ป้ายชื่อคล้องคอ A6 (4 ใบ / A4)</h1>
            <p class="text-xs text-slate-500">งานสัมมนา AI Chatbot • 30 พ.ย. – 2 ธ.ค. 2569</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button onclick="setMode('front')" id="btn-front" class="px-3.5 py-2 rounded-lg text-sm font-medium bg-[#1E3A8A] text-white transition">
            ด้านหน้า (ชื่อ + QR เช็คชื่อ)
          </button>
          <button onclick="setMode('back')" id="btn-back" class="px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            ด้านหลัง (QR เอกสาร/ประเมิน)
          </button>
          <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold bg-[#881337] hover:bg-[#6B0F2A] text-white shadow-sm transition">
            <i data-lucide="printer" class="w-4 h-4"></i> สั่งพิมพ์ / บันทึก PDF
          </button>
        </div>
      </div>

      <!-- Settings Row -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 pt-2 border-t border-slate-100 text-xs">
        <div class="md:col-span-4">
          <label class="block text-slate-500 mb-1">Apps Script API URL (ดึงรายชื่อ):</label>
          <div class="flex gap-1.5">
            <input type="url" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-300 font-mono" />
            <button onclick="loadFromApi()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700">โหลด</button>
          </div>
        </div>

        <div class="md:col-span-3">
          <label class="block text-slate-500 mb-1">ลิงก์ Google Drive (QR หลังป้ายซ้าย):</label>
          <input type="url" id="drive-url-input" oninput="renderPages()" placeholder="https://drive.google.com/..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300" />
        </div>

        <div class="md:col-span-3">
          <label class="block text-slate-500 mb-1">ลิงก์แบบประเมิน/Portal (QR หลังป้ายขวา):</label>
          <input type="url" id="eval-url-input" oninput="renderPages()" placeholder="https://..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-slate-500 mb-1">เพิ่มป้ายเปล่า (Walk-in):</label>
          <select id="blank-count" onchange="renderPages()" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
            <option value="0">ไม่เพิ่ม (0 ใบ)</option>
            <option value="4" selected>เพิ่ม 4 ใบ (1 แผ่น)</option>
            <option value="8">เพิ่ม 8 ใบ (2 แผ่น)</option>
          </select>
        </div>
      </div>

      <div id="status-bar" class="text-xs text-slate-500 flex items-center justify-between">
        <span id="summary-text">กำลังเตรียมข้อมูล...</span>
        <span class="text-amber-600 font-medium">* แนะนำ: ตอนกด Print ให้ตั้งค่า Margins = None และเปิด Background graphics</span>
      </div>
    </div>
  </header>

  <!-- ==================== PREVIEW & PRINT CONTAINER ==================== -->
  <main id="pages-container" class="py-4"></main>

  <script>
    const DEMO_DATA = [
      { id: 'AI69-01', prefix: 'พ.ต.อ.', fullName: 'สมชาย ใจดี', unit: 'ผกก.กลุ่มงานวิจัย', group: 'ผู้บริหาร' },
      { id: 'AI69-02', prefix: 'พ.ต.ท.', fullName: 'วิชัย รักชาติ', unit: 'รอง ผกก.จร.', group: 'ผู้ปฏิบัติงาน' },
      { id: 'AI69-03', prefix: 'ร.ต.อ.', fullName: 'สมหญิง จริงใจ', unit: 'รอง สว.กลุ่มงานวิจัย', group: 'วิทยากร/ทีมงาน' }
    ];

    let participants = [];
    let currentMode = 'front'; // 'front' | 'back'

    document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  const defaultApi = "https://script.google.com/macros/s/AKfycbyzFnUSHX2NoQ7jDrhtsd9pcOJPkyVjwLzn8RXkFltz6NfxLgGrzE-aqMKJT8HXH2eq/exec";
  const defaultDrive = "https://drive.google.com/drive/folders/1fXN5gSGo3ZWG7QgToPEMYY7rv_BPGD_I";
  const defaultEval = new URL('portal.html?tab=eval', window.location.href).href;

  const savedApi = localStorage.getItem('ai_seminar_api_url') || defaultApi;
  const savedDrive = localStorage.getItem('ai_seminar_drive_url') || defaultDrive;
  const savedEval = localStorage.getItem('ai_seminar_eval_url') || defaultEval;

  document.getElementById('api-url-input').value = savedApi;
  document.getElementById('drive-url-input').value = savedDrive;
  document.getElementById('eval-url-input').value = savedEval;

  loadFromApi();
});

    async function loadFromApi() {
      const apiUrl = document.getElementById('api-url-input').value.trim();
      localStorage.setItem('ai_seminar_api_url', apiUrl);

      if (!apiUrl) {
        participants = [...DEMO_DATA];
        document.getElementById('summary-text').textContent = `โหมดตัวอย่าง: ${participants.length} รายชื่อ (ใส่ API URL ด้านบนเพื่อดึงรายชื่อจริง)`;
        renderPages();
        return;
      }

      document.getElementById('summary-text').textContent = 'กำลังดึงรายชื่อจาก Google Sheets...';
      try {
        const res = await fetch(`${apiUrl}?action=getParticipants`);
        const json = await res.json();
        if (json.status === 'success') {
          participants = json.data || [];
          renderPages();
        } else {
          alert('โหลดข้อมูลไม่สำเร็จ: ' + json.message);
        }
      } catch (err) {
        alert('เชื่อมต่อ API ไม่สำเร็จ: ' + err.message);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const btnFront = document.getElementById('btn-front');
      const btnBack = document.getElementById('btn-back');

      if (mode === 'front') {
        btnFront.className = 'px-3.5 py-2 rounded-lg text-sm font-medium bg-[#1E3A8A] text-white transition';
        btnBack.className = 'px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      } else {
        btnBack.className = 'px-3.5 py-2 rounded-lg text-sm font-medium bg-[#1E3A8A] text-white transition';
        btnFront.className = 'px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      }
      renderPages();
    }

    function getGroupColor(group) {
      const g = String(group || '');
      if (g.includes('บริหาร')) return { bg: '#1E3A8A', badge: '#DBEAFE', text: '#1E3A8A' }; // น้ำเงินเข้ม
      if (g.includes('วิทยากร') || g.includes('ทีมงาน')) return { bg: '#0F766E', badge: '#CCFBF1', text: '#0F766E' }; // เขียวเข้ม
      if (g.includes('Walk-in') || g === '') return { bg: '#475569', badge: '#F1F5F9', text: '#334155' }; // เทา
      return { bg: '#881337', badge: '#FFE4E6', text: '#881337' }; // เลือดหมู (ผู้ปฏิบัติงาน)
    }

    function renderPages() {
      const container = document.getElementById('pages-container');
      container.innerHTML = '';

      const driveUrl = document.getElementById('drive-url-input').value.trim() || 'https://drive.google.com/';
      const evalUrl = document.getElementById('eval-url-input').value.trim() || 'https://forms.google.com/';
      localStorage.setItem('ai_seminar_drive_url', driveUrl);
      localStorage.setItem('ai_seminar_eval_url', evalUrl);

      const blankCount = parseInt(document.getElementById('blank-count').value, 10) || 0;
      const allItems = [...participants];

      for (let i = 0; i < blankCount; i++) {
        allItems.push({ id: '', prefix: '', fullName: '', unit: '', group: 'Walk-in', isBlank: true });
      }

      const totalPages = Math.ceil(allItems.length / 4) || 1;
      document.getElementById('summary-text').textContent =
        `ทั้งหมด ${participants.length} รายชื่อ + ป้ายเปล่า ${blankCount} ใบ = รวม ${allItems.length} ใบ (${totalPages} แผ่น A4)`;

      // แบ่งทีละ 4 ใบต่อ 1 แผ่น A4
      for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
        const pageEl = document.createElement('div');
        pageEl.className = 'a4-page';
        const chunk = allItems.slice(pageIdx * 4, pageIdx * 4 + 4);

        chunk.forEach((item, idx) => {
          const globalIdx = pageIdx * 4 + idx;
          const card = document.createElement('div');
          card.className = 'badge-card';

          if (currentMode === 'front') {
            card.innerHTML = buildFrontHtml(item, globalIdx);
          } else {
            card.innerHTML = buildBackHtml(globalIdx);
          }
          pageEl.appendChild(card);
        });

        container.appendChild(pageEl);
      }

      // สร้าง QR Code หลังจากใส่ HTML ลง DOM แล้ว
      if (currentMode === 'front') {
        allItems.forEach((item, idx) => {
          if (!item.isBlank && item.id) {
            const el = document.getElementById(`qr-front-${idx}`);
            if (el) {
              new QRCode(el, { text: item.id, width: 108, height: 108, correctLevel: QRCode.CorrectLevel.M });
            }
          }
        });
      } else {
        allItems.forEach((_, idx) => {
          const elDrive = document.getElementById(`qr-drive-${idx}`);
          const elEval = document.getElementById(`qr-eval-${idx}`);
          if (elDrive) new QRCode(elDrive, { text: driveUrl, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
          if (elEval) new QRCode(elEval, { text: evalUrl, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
        });
      }
    }

    function buildFrontHtml(item, idx) {
      const theme = getGroupColor(item.group);
      return `
        <!-- Header Band -->
        <div style="background-color: ${theme.bg};" class="text-white px-4 pb-3 pt-1 text-center">
          <div class="lanyard-slot"></div>
          <p class="text-[10px] tracking-wider uppercase opacity-90">โครงการสัมมนาเชิงปฏิบัติการ</p>
          <h2 class="text-sm font-bold leading-tight mt-0.5">AI CHATBOT ด้านงานจราจร</h2>
          <p class="text-[10px] opacity-85 mt-0.5">30 พ.ย. – 2 ธ.ค. 2569</p>
        </div>

        <!-- Body -->
        <div class="flex-1 flex flex-col items-center justify-between px-4 py-4 text-center">
          <div class="w-full">
            <span style="background-color: ${theme.badge}; color: ${theme.text};" class="inline-block px-3 py-0.5 rounded-full text-[11px] font-semibold">
              ${escapeHtml(item.group || 'ผู้เข้าร่วมสัมมนา')}
            </span>

            ${item.isBlank ? `
              <div class="mt-6 space-y-4 px-2">
                <div class="border-b border-dashed border-slate-400 h-6"></div>
                <div class="border-b border-dashed border-slate-400 h-5"></div>
                <p class="text-[10px] text-slate-400">ชื่อ - สกุล / สังกัด (Walk-in)</p>
              </div>
            ` : `
              <div class="mt-3">
                <p class="text-sm font-medium text-slate-600">${escapeHtml(item.prefix)}</p>
                <h3 class="text-xl font-bold text-slate-900 leading-snug break-words">${escapeHtml(item.fullName)}</h3>
                <p class="text-xs text-slate-500 mt-1.5 line-clamp-2">${escapeHtml(item.unit || '')}</p>
              </div>
            `}
          </div>

          <!-- QR Code ประจำตัว -->
          <div class="mt-2">
            ${item.isBlank ? `
              <div class="w-[108px] h-[108px] mx-auto border border-dashed border-slate-300 rounded-lg flex items-center justify-center text-[10px] text-slate-400">
                ลงทะเบียนหน้างาน
              </div>
              <p class="text-[11px] font-mono font-semibold text-slate-400 mt-1">WALK-IN</p>
            ` : `
              <div id="qr-front-${idx}" class="qr-box p-1.5 bg-white border border-slate-200 rounded-lg inline-block"></div>
              <p class="text-xs font-mono font-bold text-slate-700 mt-1">${escapeHtml(item.id)}</p>
            `}
          </div>
        </div>

        <!-- Footer Accent -->
        <div style="background-color: ${theme.bg};" class="h-2 w-full"></div>
      `;
    }

    function buildBackHtml(idx) {
      return `
        <div class="bg-[#1E3A8A] text-white px-4 pb-2.5 pt-1 text-center">
          <div class="lanyard-slot"></div>
          <h2 class="text-xs font-bold tracking-wide">ข้อมูลสำหรับผู้เข้าร่วมสัมมนา</h2>
        </div>

        <div class="flex-1 flex flex-col justify-between p-4 text-center">
          <!-- 2 QR Codes -->
          <div class="grid grid-cols-2 gap-3 my-auto">
            <div class="flex flex-col items-center p-2 rounded-xl bg-slate-50 border border-slate-200">
              <div id="qr-drive-${idx}" class="qr-box bg-white p-1 rounded"></div>
              <p class="text-[11px] font-bold text-[#1E3A8A] mt-2">คลังเอกสาร</p>
              <p class="text-[9px] text-slate-500">สไลด์ & ไฟล์ประกอบ</p>
            </div>

            <div class="flex flex-col items-center p-2 rounded-xl bg-slate-50 border border-slate-200">
              <div id="qr-eval-${idx}" class="qr-box bg-white p-1 rounded"></div>
              <p class="text-[11px] font-bold text-[#881337] mt-2">แบบประเมินผล</p>
              <p class="text-[9px] text-slate-500">ความพึงพอใจงานสัมมนา</p>
            </div>
          </div>

          <!-- Short Info -->
          <div class="mt-3 pt-2.5 border-t border-slate-200 text-[10px] text-slate-600 space-y-1">
            <p class="font-semibold text-slate-800">กำหนดการ: 30 พ.ย. – 2 ธ.ค. 2569</p>
            <p>ลงทะเบียนเวลา 08.30 น. | เริ่มสัมมนา 09.00 น.</p>
            <p class="text-slate-400">กรุณาสวมป้ายชื่อตลอดระยะเวลาการเข้าร่วมสัมมนา</p>
          </div>
        </div>

        <div class="bg-[#881337] h-2 w-full"></div>
      `;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
