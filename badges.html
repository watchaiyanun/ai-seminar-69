<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>พิมพ์ป้ายชื่อคล้องคอ A6 (Smart QR) - แชทบอท AI คู่หูจราจร</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f1f5f9;
    }

    /* ขนาดหน้ากระดาษ A4 สำหรับแสดงผลและพิมพ์ (4 ใบ/หน้า) */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: white;
      margin: 16px auto;
      padding: 6mm;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4mm;
      box-sizing: border-box;
    }

    /* ป้ายชื่อขนาด A6 พอดีซองพลาสติกคล้องคอมาตรฐาน */
    .badge-card {
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      position: relative;
      box-sizing: border-box;
    }

    /* ไกด์ไลน์ช่องเจาะสายคล้องคอ */
    .lanyard-slot {
      width: 16mm;
      height: 3.5mm;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      margin: 3.5mm auto 2mm auto;
    }

    .qr-box img, .qr-box canvas {
      margin: 0 auto;
      display: block;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: white !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
      }
      .a4-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- ==================== CONTROL BAR (ซ่อนตอนพิมพ์) ==================== -->
  <header class="no-print sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#1E3A8A] to-[#881337] text-white flex items-center justify-center shadow-sm">
            <i data-lucide="id-card" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-900 text-base">ระบบพิมพ์ป้ายชื่อคล้องคอ A6 (Smart QR Code)</h1>
            <p class="text-xs text-slate-500">โครงการสัมมนาจัดทำคลังความรู้งานจราจร (แชทบอท AI คู่หูจราจร)</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <a href="index.html" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> กลับ Dashboard
          </a>
          <button onclick="setMode('front')" id="btn-front" class="px-3.5 py-2 rounded-xl text-sm font-medium bg-[#1E3A8A] text-white transition">
            ด้านหน้า (Smart QR รายบุคคล)
          </button>
          <button onclick="setMode('back')" id="btn-back" class="px-3.5 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
            ด้านหลัง (QR เอกสาร / ประเมิน)
          </button>
          <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-[#881337] hover:bg-[#6B0F2A] text-white shadow-sm transition">
            <i data-lucide="printer" class="w-4 h-4"></i> สั่งพิมพ์ / บันทึก PDF
          </button>
        </div>
      </div>

      <!-- Settings Row -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 pt-2 border-t border-slate-100 text-xs">
        <div class="md:col-span-4">
          <label class="block text-slate-500 mb-1">Apps Script API URL:</label>
          <div class="flex gap-1.5">
            <input type="url" id="api-url-input" class="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-300 font-mono" />
            <button onclick="loadFromApi()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700">โหลด</button>
          </div>
        </div>

        <div class="md:col-span-3">
          <label class="block text-slate-500 mb-1">ลิงก์ Portal (ฐานสร้าง Smart QR):</label>
          <input type="url" id="portal-url-input" oninput="renderPages()" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 font-mono" />
        </div>

        <div class="md:col-span-3">
          <label class="block text-slate-500 mb-1">ลิงก์ Google Drive (QR ด้านหลัง):</label>
          <input type="url" id="drive-url-input" oninput="renderPages()" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-slate-500 mb-1">ป้ายเปล่า (Walk-in):</label>
          <select id="blank-count" onchange="renderPages()" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white">
            <option value="0">ไม่เพิ่ม (0 ใบ)</option>
            <option value="4" selected>เพิ่ม 4 ใบ (1 แผ่น)</option>
            <option value="8">เพิ่ม 8 ใบ (2 แผ่น)</option>
          </select>
        </div>
      </div>

      <div id="status-bar" class="text-xs flex flex-wrap items-center justify-between gap-2">
        <span id="summary-text" class="text-slate-600 font-medium">กำลังโหลดรายชื่อจาก Google Sheets...</span>
        <span class="text-amber-700 bg-amber-50 px-2.5 py-1 rounded-lg border border-amber-200">
          * ตอนกด Print ให้ตั้งค่า <strong>Margins = None</strong> และเปิด <strong>Background graphics</strong>
        </span>
      </div>
      <div id="error-banner" class="hidden p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs"></div>
    </div>
  </header>

  <!-- ==================== PREVIEW & PRINT CONTAINER ==================== -->
  <main id="pages-container" class="py-4"></main>

  <script>
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbyzFnUSHX2NoQ7jDrhtsd9pcOJPkyVjwLzn8RXkFltz6NfxLgGrzE-aqMKJT8HXH2eq/exec";
    const DEFAULT_DRIVE_URL = "https://drive.google.com/drive/folders/1fXN5gSGo3ZWG7QgToPEMYY7rv_BPGD_I";

    let participants = [];
    let currentMode = 'front'; // 'front' | 'back'

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const defaultPortal = new URL('portal.html', window.location.href).href;

      document.getElementById('api-url-input').value = localStorage.getItem('ai_seminar_api_url') || DEFAULT_API_URL;
      document.getElementById('portal-url-input').value = localStorage.getItem('ai_seminar_portal_url') || defaultPortal;
      document.getElementById('drive-url-input').value = localStorage.getItem('ai_seminar_drive_url') || DEFAULT_DRIVE_URL;

      loadFromApi();
    });

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      if (!msg) { banner.classList.add('hidden'); return; }
      banner.textContent = msg;
      banner.classList.remove('hidden');
    }

    async function loadFromApi() {
      showError('');
      const apiUrl = document.getElementById('api-url-input').value.trim();
      localStorage.setItem('ai_seminar_api_url', apiUrl);
      document.getElementById('summary-text').textContent = 'กำลังดึงรายชื่อจาก Google Sheets...';

      try {
        const res = await fetch(`${apiUrl}?action=getParticipants`);
        const json = await res.json();
        if (json.status === 'success') {
          participants = (json.data || []).map(p => ({
            ...p,
            fullName: p.prefix ? `${p.prefix}${p.fullName}` : p.fullName,
            mainUnit: p.mainUnit || p.group || 'ผู้เข้าร่วมสัมมนา',
            unitDetail: p.unitDetail || p.unit || ''
          }));
          renderPages();
        } else {
          showError('โหลดข้อมูลไม่สำเร็จ: ' + json.message);
        }
      } catch (err) {
        showError('เชื่อมต่อ API ไม่สำเร็จ: ' + err.message);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const btnFront = document.getElementById('btn-front');
      const btnBack = document.getElementById('btn-back');

      if (mode === 'front') {
        btnFront.className = 'px-3.5 py-2 rounded-xl text-sm font-medium bg-[#1E3A8A] text-white transition';
        btnBack.className = 'px-3.5 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      } else {
        btnBack.className = 'px-3.5 py-2 rounded-xl text-sm font-medium bg-[#1E3A8A] text-white transition';
        btnFront.className = 'px-3.5 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      }
      renderPages();
    }

    // แยกแถบสีตามบทบาท/หน่วย
    function getBadgeTheme(item) {
      const role = String(item.role || '');
      const unit = String(item.mainUnit || '');
      if (item.isBlank) return { bg: '#475569', badge: '#F1F5F9', text: '#334155' };
      if (role.includes('คณะทำงาน') || unit === 'สยศ.ตร.') return { bg: '#0F766E', badge: '#CCFBF1', text: '#0F766E' };
      if (role.includes('ผู้ทรง') || role.includes('วิทยากร') || unit === 'หน่วยงานภายนอก') return { bg: '#881337', badge: '#FFE4E6', text: '#881337' };
      return { bg: '#1E3A8A', badge: '#DBEAFE', text: '#1E3A8A' };
    }

    function renderPages() {
      const container = document.getElementById('pages-container');
      container.innerHTML = '';

      const portalBase = document.getElementById('portal-url-input').value.trim() || new URL('portal.html', window.location.href).href;
      const driveUrl = document.getElementById('drive-url-input').value.trim() || DEFAULT_DRIVE_URL;
      const evalUrl = portalBase.includes('?') ? `${portalBase}&tab=eval` : `${portalBase}?tab=eval`;

      localStorage.setItem('ai_seminar_portal_url', portalBase);
      localStorage.setItem('ai_seminar_drive_url', driveUrl);

      const blankCount = parseInt(document.getElementById('blank-count').value, 10) || 0;
      const allItems = [...participants];

      for (let i = 0; i < blankCount; i++) {
        allItems.push({ id: '', fullName: '', position: '', mainUnit: 'Walk-in', unitDetail: '', role: 'ผู้เข้าร่วมหน้างาน', isBlank: true });
      }

      const totalPages = Math.ceil(allItems.length / 4) || 1;
      document.getElementById('summary-text').textContent =
        `รายชื่อจริง ${participants.length} ราย + ป้ายเปล่า ${blankCount} ใบ = รวม ${allItems.length} ใบ (${totalPages} แผ่น A4)`;

      for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
        const pageEl = document.createElement('div');
        pageEl.className = 'a4-page';
        const chunk = allItems.slice(pageIdx * 4, pageIdx * 4 + 4);

        chunk.forEach((item, idx) => {
          const globalIdx = pageIdx * 4 + idx;
          const card = document.createElement('div');
          card.className = 'badge-card';
          card.innerHTML = currentMode === 'front' ? buildFrontHtml(item, globalIdx) : buildBackHtml(globalIdx);
          pageEl.appendChild(card);
        });
        container.appendChild(pageEl);
      }

      // สร้าง QR Code
      if (currentMode === 'front') {
        allItems.forEach((item, idx) => {
          if (!item.isBlank && item.id) {
            const el = document.getElementById(`qr-front-${idx}`);
            if (el) {
              // Smart QR Code: ลิงก์ตรงไปหน้า Portal พร้อมรหัสประจำตัว
              const smartUrl = `${portalBase}${portalBase.includes('?') ? '&' : '?'}id=${encodeURIComponent(item.id)}`;
              new QRCode(el, { text: smartUrl, width: 102, height: 102, correctLevel: QRCode.CorrectLevel.L });
            }
          }
        });
      } else {
        allItems.forEach((_, idx) => {
          const elDrive = document.getElementById(`qr-drive-${idx}`);
          const elEval = document.getElementById(`qr-eval-${idx}`);
          if (elDrive) new QRCode(elDrive, { text: driveUrl, width: 92, height: 92, correctLevel: QRCode.CorrectLevel.M });
          if (elEval) new QRCode(elEval, { text: evalUrl, width: 92, height: 92, correctLevel: QRCode.CorrectLevel.M });
        });
      }
    }

    function buildFrontHtml(item, idx) {
      const theme = getBadgeTheme(item);
      const badgeLabel = item.role && item.role !== 'ผู้เข้าร่วมสัมมนา' ? `${item.mainUnit} • ${item.role}` : item.mainUnit;
      return `
        <!-- Header Band -->
        <div style="background-color: ${theme.bg};" class="text-white px-3 pb-2.5 pt-1 text-center">
          <div class="lanyard-slot"></div>
          <p class="text-[9.5px] tracking-wide opacity-90">โครงการสัมมนาจัดทำคลังความรู้งานจราจร</p>
          <h2 class="text-[13px] font-bold leading-tight mt-0.5">แชทบอท AI คู่หูจราจร</h2>
          <p class="text-[9px] opacity-85 mt-0.5">30 พ.ย. – 2 ธ.ค. 69 | ไพน์เฮิร์สทฯ จ.ปทุมธานี</p>
        </div>

        <!-- Body -->
        <div class="flex-1 flex flex-col items-center justify-between px-3.5 py-3 text-center">
          <div class="w-full">
            <span style="background-color: ${theme.badge}; color: ${theme.text};" class="inline-block px-3 py-0.5 rounded-full text-[10px] font-semibold max-w-full truncate">
              ${escapeHtml(badgeLabel)}
            </span>

            ${item.isBlank ? `
              <div class="mt-6 space-y-4 px-2">
                <div class="border-b border-dashed border-slate-400 h-6"></div>
                <div class="border-b border-dashed border-slate-400 h-5"></div>
                <p class="text-[10px] text-slate-400">ยศ ชื่อ - สกุล / สังกัด (Walk-in)</p>
              </div>
            ` : `
              <div class="mt-2.5">
                <h3 class="text-[16px] font-bold text-slate-900 leading-snug break-words">${escapeHtml(item.fullName)}</h3>
                <p class="text-[11px] font-medium text-slate-600 mt-1 line-clamp-2">${escapeHtml(item.position || '')}</p>
                <p class="text-[10px] text-slate-400 mt-0.5 truncate">${escapeHtml(item.unitDetail || '')}</p>
              </div>
            `}
          </div>

          <!-- Smart QR Code -->
          <div class="mt-1.5">
            ${item.isBlank ? `
              <div class="w-[102px] h-[102px] mx-auto border border-dashed border-slate-300 rounded-lg flex items-center justify-center text-[10px] text-slate-400">
                ลงทะเบียนหน้างาน
              </div>
              <p class="text-[10px] font-mono font-semibold text-slate-400 mt-1">WALK-IN</p>
            ` : `
              <div id="qr-front-${idx}" class="qr-box p-1 bg-white border border-slate-200 rounded-lg inline-block"></div>
              <p class="text-[11px] font-mono font-bold text-slate-800 mt-0.5">${escapeHtml(item.id)}</p>
              <p class="text-[8.5px] text-slate-400">สแกนเพื่อเช็กอิน / ดูเอกสาร / ประเมินผล</p>
            `}
          </div>
        </div>

        <!-- Footer Accent -->
        <div style="background-color: ${theme.bg};" class="h-2 w-full"></div>
      `;
    }

    function buildBackHtml(idx) {
      return `
        <div class="bg-[#1E3A8A] text-white px-4 pb-2.5 pt-1 text-center">
          <div class="lanyard-slot"></div>
          <h2 class="text-xs font-bold tracking-wide">คลังเอกสาร & แบบประเมินงานสัมมนา</h2>
        </div>

        <div class="flex-1 flex flex-col justify-between p-3.5 text-center">
          <p class="text-[10px] text-slate-600 bg-blue-50 border border-blue-100 rounded-lg py-1.5 px-2">
            ท่านสามารถสแกน <strong>QR ด้านหน้าป้าย</strong> เพื่อเข้าหน้าส่วนตัว<br>หรือสแกนทางลัดด้านล่างนี้ได้ทันที
          </p>

          <div class="grid grid-cols-2 gap-2.5 my-auto">
            <div class="flex flex-col items-center p-2 rounded-xl bg-slate-50 border border-slate-200">
              <div id="qr-drive-${idx}" class="qr-box bg-white p-1 rounded"></div>
              <p class="text-[10.5px] font-bold text-[#1E3A8A] mt-1.5">คลังเอกสาร Drive</p>
              <p class="text-[8.5px] text-slate-500">สไลด์ & ไฟล์ประกอบ</p>
            </div>

            <div class="flex flex-col items-center p-2 rounded-xl bg-slate-50 border border-slate-200">
              <div id="qr-eval-${idx}" class="qr-box bg-white p-1 rounded"></div>
              <p class="text-[10.5px] font-bold text-[#881337] mt-1.5">แบบประเมินผล</p>
              <p class="text-[8.5px] text-slate-500">ความพึงพอใจสัมมนา</p>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-200 text-[9.5px] text-slate-600 space-y-0.5">
            <p class="font-semibold text-slate-800">30 พ.ย. – 2 ธ.ค. 2569 | ไพน์เฮิร์สทฯ จ.ปทุมธานี</p>
            <p class="text-slate-400">กรุณาสวมป้ายชื่อตลอดระยะเวลาการเข้าร่วมสัมมนา</p>
          </div>
        </div>

        <div class="bg-[#881337] h-2 w-full"></div>
      `;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
